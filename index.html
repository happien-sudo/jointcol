    // 메인 앱 컴포넌트
    function App() {
      const [activeTab, setActiveTab] = useState('home'); // 'home', 'guide', 'courses', 'simulator', 'faq'
      const [selectedGrade, setSelectedGrade] = useState('all'); // 'all', 'grade1', 'grade2'
      const [selectedType, setSelectedType] = useState('all'); // 'all', 'online', 'offline'
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [selectedDay, setSelectedDay] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [viewMode, setViewMode] = useState('card'); // 'card' or 'school'
      const [selectedCourseModal, setSelectedCourseModal] = useState(null);

      // 출결 계산기 상태
      const [calcCredits, setCalcCredits] = useState(2); // 2 or 3
      const [calcAbsence, setCalcAbsence] = useState(0);

      // 자가진단 체크리스트 상태
      const [checkList, setCheckList] = useState({
        q1: false,
        q2: false,
        q3: false,
        q4: false
      });

      // Lucide 아이콘 초기화
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, viewMode, selectedCourseModal, selectedGrade, selectedType, selectedCategory]);

      // 필터링된 강좌 목록
      const filteredCourses = useMemo(() => {
        return COURSES_DATA.filter(course => {
          // 학년 필터
          if (selectedGrade === 'grade1') {
            if (!course.grade.includes('1학년')) return false;
          } else if (selectedGrade === 'grade2') {
            if (!course.grade.includes('2학년')) return false;
          }

          // 운영 형태 필터
          if (selectedType === 'online' && course.type !== '온라인') return false;
          if (selectedType === 'offline' && course.type !== '오프라인') return false;

          // 계열 필터
          if (selectedCategory !== 'all' && course.category !== selectedCategory) return false;

          // 요일 필터
          if (selectedDay === 'wed') {
            if (!course.days || !course.days.includes('수') || course.days.includes('월')) return false;
          } else if (selectedDay === 'mon_wed') {
            if (!course.days || !course.days.includes('월')) return false;
          }

          // 검색어 (과목명, 학교명, 키워드)
          if (searchQuery.trim() !== '') {
            const query = searchQuery.toLowerCase().trim();
            const matchName = course.subject.toLowerCase().includes(query);
            const matchSchool = course.school.toLowerCase().includes(query);
            const matchDesc = course.description.toLowerCase().includes(query);
            const matchCat = course.category.toLowerCase().includes(query);
            if (!matchName && !matchSchool && !matchDesc && !matchCat) return false;
          }

          return true;
        });
      }, [selectedGrade, selectedType, selectedCategory, selectedDay, searchQuery]);

      // 학교별 그룹화
      const schoolGrouped = useMemo(() => {
        const groups = {};
        filteredCourses.forEach(c => {
          if (!groups[c.school]) {
            groups[c.school] = [];
          }
          groups[c.school].push(c);
        });
        return groups;
      }, [filteredCourses]);

      // 출결 계산기 로직
      const calcStats = useMemo(() => {
        const total = calcCredits === 2 ? 32 : 48;
        const required = calcCredits === 2 ? 22 : 32; // 기준 수업량 2/3 이상
        const totalAbsence = calcAbsence;
        const currentAttended = Math.max(0, total - totalAbsence);
        const maxPossibleAbsence = total - required; // 2학점: 최대 10회 결석 가능, 3학점: 최대 16회 결석 가능
        const remainingAbsenceBudget = maxPossibleAbsence - totalAbsence;

        let status = "안전 (정상 이수 가능)";
        let statusColor = "text-emerald-700 bg-emerald-50 border-emerald-200";
        if (remainingAbsenceBudget < 0) {
          status = "학점 미이수 위험 (기준 출석 미달)";
          statusColor = "text-rose-700 bg-rose-50 border-rose-200";
        } else if (remainingAbsenceBudget <= 2) {
          status = "경고 (결석 한도 임박)";
          statusColor = "text-amber-700 bg-amber-50 border-amber-200";
        }

        return {
          total,
          required,
          totalAbsence,
          currentAttended,
          maxPossibleAbsence,
          remainingAbsenceBudget,
          status,
          statusColor

                {/* 2. 2026 과목선택 나침반 연계: 과목의 성격 및 공식 교과 정보 (수업 시작일 바로 아래 배치) */}
                <div className="p-5 rounded-2xl bg-latte-50/90 border border-latte-200 shadow-2xs mb-5 space-y-3.5">
                  <div className="flex items-center justify-between flex-wrap gap-2 pb-2.5 border-b border-latte-200">
                    <div className="flex items-center space-x-2">
                      <div className="w-8 h-8 rounded-lg bg-latte-600 text-white flex items-center justify-center shrink-0">
                        <i data-lucide="compass" className="w-4 h-4"></i>
                      </div>
                      <div>
                        <span className="text-[11px] font-bold text-latte-700 block">2026 선택과목 나침반 연계</span>
                        <h4 className="text-base font-bold text-warm-textMain flex items-center gap-2">
                          <span>과목의 성격 및 공식 교과 정보</span>
                          <span className="text-xs font-bold px-2.5 py-0.5 rounded-full bg-latte-200 text-latte-900 border border-latte-300">
                            {selectedCourseModal.selectionType}
                          </span>
                        </h4>
                      </div>
                    </div>
                    <div className="flex items-center gap-1.5 flex-wrap">
                      <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-white text-latte-700 border border-latte-200">
                        {selectedCourseModal.category} 계열
                      </span>
                      <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-latte-100 text-latte-800 border border-latte-200">
                        석차등급 '·' 표기
                      </span>
                    </div>
                  </div>

                  {/* 공식 교과 정보 & 성적 기재 방식 카드 */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <div className="p-3.5 rounded-xl bg-white/80 border border-latte-100">
                      <span className="text-[11px] font-bold text-warm-textSub block mb-1">공식 교과 정보 (교육과정 편제)</span>
                      <span className="text-sm font-bold text-warm-textMain block">{selectedCourseModal.subjectInfo}</span>
                    </div>
                    <div className="p-3.5 rounded-xl bg-white/80 border border-latte-100">
                      <span className="text-[11px] font-bold text-warm-textSub block mb-1">성적 산출 및 기재 방식</span>
                      <span className="text-xs md:text-sm font-bold text-warm-textMain block mb-0.5">{selectedCourseModal.evaluation}</span>
                      <p className="text-[11px] text-warm-textMuted leading-relaxed">
                        소인수 선택에 따른 등급 산출 불이익 없이 심화 학습에 몰입할 수 있습니다.
                      </p>
                    </div>
                  </div>

                  {/* 과목의 성격 */}
                  {selectedCourseModal.subjectNature && (
                    <div className="text-xs md:text-sm text-warm-textMain leading-relaxed bg-white/80 p-3.5 rounded-xl border border-latte-100">
                      <strong className="text-latte-800 font-bold block mb-1.5 flex items-center space-x-1.5">
                        <i data-lucide="sparkles" className="w-3.5 h-3.5 text-latte-600"></i>
                        <span>과목의 성격</span>
                      </strong>
                      <p className="text-warm-textMain leading-relaxed">{selectedCourseModal.subjectNature}</p>
                    </div>
                  )}
                </div>

                {/* 3. 수업 운영 및 이수 준칙 세부 그리드 */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5 text-xs md:text-sm">
                  {/* 이수 학점 / 총 수업 시수 */}
                  <div className="p-3.5 rounded-xl bg-white/80 border border-warm-border">
                    <span className="text-warm-textSub text-xs block mb-0.5 font-medium">이수 학점 / 총 기준 수업량</span>
                    <span className="font-bold text-warm-textMain">
                      {selectedCourseModal.credits > 0 ? `${selectedCourseModal.credits}학점 (총 ${selectedCourseModal.totalHours}차시)` : '-'}
                    </span>
                    {selectedCourseModal.credits > 0 && (
                      <span className="text-[11px] text-latte-700 block mt-0.5 font-medium">
                        * 최소 출석 기준: <strong>{selectedCourseModal.credits === 2 ? '22차시 이상 (결석 10회 이내)' : '32차시 이상 (결석 16회 이내)'}</strong>
                      </span>
                    )}
                  </div>

                  {/* 수업 장소 / 플랫폼 */}
                  <div className="p-3.5 rounded-xl bg-white/80 border border-warm-border">
                    <span className="text-warm-textSub text-xs block mb-0.5 font-medium">수업 장소 및 플랫폼</span>
                    <span className="font-bold text-warm-textMain">{selectedCourseModal.classroom}</span>
                    <span className="text-[11px] text-warm-textMuted block mt-0.5">
                      운영 형태: {selectedCourseModal.type} ({selectedCourseModal.locationType})
                    </span>
                    {selectedCourseModal.type === '온라인' && (
                      <span className="text-[11px] text-cyan-800 font-semibold block mt-1">
                        * 온라인 수업은 '경기온라인학교, 온라인공동교육과정' 사이트에서 실시간 화상으로 진행됩니다. (정기시험 실시 시 전원 거점교 오프라인 대면 실시)
                      </span>
                    )}
                  </div>

                  {/* 수강 대상 학년 및 정원 */}
                  <div className="p-3.5 rounded-xl bg-white/80 border border-warm-border">
                    <span className="text-warm-textSub text-xs block mb-0.5 font-medium">수강 대상 학년 및 수강 정원</span>
                    <span className="font-bold text-warm-textMain">
                      {selectedCourseModal.grade} · {selectedCourseModal.capacity}
                    </span>
                    <span className="text-[11px] text-warm-textMuted block mt-0.5">
                      * 소속 학교 미개설 과목 수강 원칙 준수
                    </span>
                  </div>

                  {/* 학점 이수 기준 */}
                  <div className="p-3.5 rounded-xl bg-white/80 border border-warm-border">
                    <span className="text-warm-textSub text-xs block mb-0.5 font-medium">학점 이수 기준 (선택 과목)</span>
                    <span className="font-bold text-latte-800">
                      과목출석률 2/3 이상 출석
                    </span>
                    <span className="text-[11px] text-warm-textMuted block mt-0.5">
                      * 1학점당 16시수 기준 (미도달 시 최소 성취수준 보장지도/추가학습 지원)
                    </span>
                  </div>
                </div>

                {/* 모달 하단 버튼 */}
                <div className="flex flex-col-reverse sm:flex-row justify-end gap-2.5 pt-4 border-t border-warm-border">
                  <button
                    onClick={() => setSelectedCourseModal(null)}
                    className="px-5 py-2.5 rounded-xl bg-latte-200 hover:bg-latte-300 text-latte-900 font-semibold text-xs md:text-sm transition-colors text-center"
                  >
                    닫기
                  </button>
                  {selectedCourseModal.credits > 0 && (
                    <button
                      onClick={() => {
                        setCalcCredits(selectedCourseModal.credits);
                        setSelectedCourseModal(null);
                        setActiveTab('simulator');
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                      }}
                      className="px-5 py-2.5 rounded-xl bg-latte-600 hover:bg-latte-700 text-white font-semibold text-xs md:text-sm transition-colors shadow-2xs flex items-center justify-center space-x-1.5"
                    >
                      <i data-lucide="calculator" className="w-4 h-4"></i>
                      <span>이 과목({selectedCourseModal.credits}학점) 출결 및 이수 계산해보기</span>
                    </button>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* 하단 푸터 */}
          <footer className="bg-warm-sand border-t border-warm-border py-10 mt-auto">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center sm:text-left">
              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
                <div>
                  <h4 className="font-bold text-warm-textMain text-base">
                    부천 공동교육과정 안내
                  </h4>
                  <p className="text-xs text-warm-textSub mt-1">
                    학생의 과목 선택권을 보장하고 심화·소인수 교과를 공교육 테두리 내에서 연계 운영하는 정규 학사 과정
                  </p>
                </div>
                <div className="text-xs text-warm-textMuted bg-warm-card px-3.5 py-2 rounded-xl border border-warm-border">
                  기반 문서: 2026 부천지역 고교 공동교육과정 편성 현황 및 학사 운영 지침
                </div>
              </div>

              <div className="pt-6 border-t border-warm-border/60 text-center sm:text-left text-xs text-warm-textSub">
                <span>© 2026 정명고등학교</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
